<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Craigslist Redesign</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">☮</div>

        <div class="menu">
            <p>communities</p>
            <p>services</p>
            <p>discussion</p>
            <p>housing</p>
            <p>for sale</p>
            <p>jobs</p>
            <p>gigs</p>
            <p>resumes</p>
        </div>
    </aside>

    <!-- MAIN CENTER -->
    <main class="main">
        <h1>Craigslist</h1>

        <div class="search">
            <span class="icon">🔍</span>
            <input type="text">
        </div>

        <div class="links">
            <a>help</a>
            <a>faq</a>
            <a>about us</a>
        </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right">

        <div class="top-icons">
            <span>☐</span>
            <span>☆</span>
        </div>

        <div class="lang">english ▾</div>

        <div class="location-box">
            <p>okc city</p>
            <div class="circle"></div>
            <p class="miles">10 miles</p>
        </div>

        <button>search by location</button>

    </aside>

</div>

<script src="script.js"></script>
</body>
</html>
